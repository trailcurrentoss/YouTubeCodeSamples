## Panel and touch drivers for the MaTouch 2.1".

dependencies:
  # CST826 speaks the CST816S register map at the same I2C address.
  #
  # Pinned to the esp_lcd_touch 1.1 series to stay in step with
  # esp_lvgl_port ~2.4 (itself pinned to LVGL 9.2.2). esp_lcd_touch 1.2
  # deprecates esp_lcd_touch_get_coordinates(), which esp_lvgl_port 2.4 still
  # calls, so every build warns. cst816s 1.1.0 is the last driver release
  # that accepts esp_lcd_touch 1.1; 1.1.1+ require ^1.2. Bump all of these
  # together with esp_lvgl_port, never alone.
  espressif/esp_lcd_touch:
    version: "~1.1.2"
  espressif/esp_lcd_touch_cst816s:
    version: "1.1.0"

  # ST7701S -- 480x480 RGB565 parallel, with a 3-wire SPI sideband for init.
  espressif/esp_lcd_st7701:
    version: "^1.1"

  # Provides esp_lcd_new_panel_io_3wire_spi(), which the ST7701's init
  # sideband needs. NOT part of esp_lcd_st7701 or of ESP-IDF's esp_lcd.
  espressif/esp_lcd_panel_io_additions:
    version: "^1.0"
