## Meshtastic messenger — Elecrow CrowPanel Advance 10.1" ESP32-P4.
dependencies:
  # LVGL 8.4 must match the .eez-project's lvglVersion; esp_lvgl_port is the
  # glue the BSP's bsp_illuminate uses. Pin them together.
  lvgl/lvgl:
    version: "~8.4.0"
    public: true
  espressif/esp_lvgl_port: "~2.8.0"

  # EK79007 MIPI-DSI panel + GT911 touch.
  espressif/esp_lcd_ek79007: "^1.0.2"
  espressif/esp_lcd_touch_gt911: "^1.1.3"

  idf: ">=5.3"
