# Disable the kernel's magic SysRq handling. MANDATORY on this hardware.
#
# The Select button reports as KEY_SYSRQ, and the kernel binds a sysrq handler
# directly to this keyboard:
#
#     N: Name="My Company My Custom Pico Keyboard"
#     H: Handlers=sysrq kbd leds event1
#
# Raspberry Pi OS ships kernel.sysrq=438, which enables reboot/poweroff (128)
# and remount-read-only (32) among others. So an Alt-plus-Select chord hard-cuts
# power without syncing — on the one button a user presses constantly to go
# Back, on a device that is powered off by holding a button and therefore has to
# survive unclean shutdowns.
#
# Reading the key as an ordinary keycode is unaffected by this: Select still
# works as Back. Only the kernel's magic interpretation is switched off.
kernel.sysrq = 0
