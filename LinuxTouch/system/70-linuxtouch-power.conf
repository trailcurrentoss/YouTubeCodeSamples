# logind: the power button must not hard-kill a handheld.
#
# A short press is ignored at the logind level so it reaches the shell as an
# event, which raises a "Shut down?" confirmation. A long press still powers
# off, as the escape hatch when the UI is not responding.
#
# Rationale: this device gets carried in a bag, and a brushed power button that
# kills it silently mid-write is a bug, not a feature. See docs/controls.md.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff

# Never suspend. There is no lid, the panel has no backlight to blank, and a
# handheld that suspends in a bag and cannot be woken by touch looks dead.
HandleSuspendKey=ignore
IdleAction=ignore
